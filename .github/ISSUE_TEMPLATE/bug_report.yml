name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `sk1ll --version` (and `sk1ll-server --version` for fleet issues)
      placeholder: sk1ll 0.1.0 (1a2b3c4d5e)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Standalone, Fleet]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and version, and the harnesses involved
      placeholder: Ubuntu 24.04, Claude Code and Codex
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        `journalctl --user -u sk1ll-daemon` (or ~/.cache/sk1ll/daemon.log), with RUST_LOG=debug if you can
        reproduce it. Remove tokens and join codes first.
      render: text
