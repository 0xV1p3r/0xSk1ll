name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: pnpm/action-setup@v4.3.0
        with:
          package_json_file: crates/sk1ll-gui/ui/package.json
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/sk1ll-gui/ui/pnpm-lock.yaml

      - name: Versions agree
        run: scripts/check-version.sh

      - name: UI
        working-directory: crates/sk1ll-gui/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit
          pnpm lint
          pnpm test
          pnpm build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      # dev-fleet.sh builds only server + daemon, which unifies features
      # differently from --workspace; prebuild so the test's startup deadline
      # does not absorb a cold compile.
      - run: cargo build -p sk1ll-server -p sk1ll-daemon --locked
      - name: Dev fleet
        run: python3 crates/sk1ll-gui/tests/test_dev_fleet.py

  actions-lock:
    # Fails when .github/workflows/actions.lock is out of sync with the
    # workflows or a locked commit no longer verifies upstream.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
