name: Release

# Push a tag like v0.1.0. This builds the Linux archives and the .deb, then
# opens a draft GitHub release to review and publish. Publishing it builds the
# server image (server-image.yml) and, for a stable tag, offers the .deb to the
# app's updater: latest.json is its manifest, at releases/latest.
#
# The build jobs never see the updater signing key. The sign job, in the
# `release` environment (v* tags only, approved by hand), signs the finished
# .deb with its TAURI_SIGNING_PRIVATE_KEY secret and runs nothing else.
#
# Nothing here reads a cache: a tag build can restore caches the default
# branch wrote, so a poisoned CI cache would end up in the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree with the tag
        run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: Stable or pre-release
        id: tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  linux-x86_64:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: crates/sk1ll-gui/ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build
        env:
          SK1LL_COMMIT: ${{ github.sha }}
        run: |
          export SK1LL_COMMIT="${SK1LL_COMMIT::10}"
          (cd crates/sk1ll-gui/ui && pnpm install --frozen-lockfile)
          cargo build --release --locked -p sk1ll-cli -p sk1ll-server
          # The .deb ships the CLI next to the app, so the app starts a daemon of its own version.
          mkdir -p crates/sk1ll-gui/src-tauri/binaries
          cp target/release/sk1ll crates/sk1ll-gui/src-tauri/binaries/sk1ll-x86_64-unknown-linux-gnu
          # Unsigned: the sign job adds the updater signature.
          (cd crates/sk1ll-gui/ui && pnpm tauri build --config src-tauri/tauri.release.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false}}')
      - name: Package
        run: scripts/package-release.sh x86_64 target/release/sk1ll target/release/sk1ll-server target/release/sk1ll-gui
      - name: Add the .deb
        run: cp target/release/bundle/deb/*.deb dist/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  linux-aarch64:
    # CLI and server only. Needs GitHub's arm64 Linux runners on this plan.
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        env:
          SK1LL_COMMIT: ${{ github.sha }}
        run: |
          export SK1LL_COMMIT="${SK1LL_COMMIT::10}"
          cargo build --release --locked -p sk1ll-cli -p sk1ll-server
      - name: Package
        run: scripts/package-release.sh aarch64 target/release/sk1ll target/release/sk1ll-server
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-aarch64
          path: dist/*
          if-no-files-found: error

  sign:
    needs: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds the TAURI_SIGNING_PRIVATE_KEY secret; only v* tags may deploy to it.
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: crates/sk1ll-gui/ui/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Only the Tauri CLI runs in this job: no install scripts, no build.
      - name: Install the Tauri CLI
        working-directory: crates/sk1ll-gui/ui
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-x86_64
          path: bundles
      - name: Sign the .deb for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [[ -n $TAURI_SIGNING_PRIVATE_KEY ]] || { echo "the release environment has no TAURI_SIGNING_PRIVATE_KEY secret" >&2; exit 1; }
          shopt -s nullglob
          debs=("$GITHUB_WORKSPACE"/bundles/*.deb)
          [[ ${#debs[@]} -eq 1 ]] || { echo "expected one .deb, found ${#debs[@]}" >&2; exit 1; }
          pnpm --dir crates/sk1ll-gui/ui exec tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "${debs[0]}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: updater-signatures
          path: bundles/*.sig
          if-no-files-found: error

  release:
    needs: [verify, linux-x86_64, linux-aarch64, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Updater manifest
        working-directory: dist
        run: |
          shopt -s nullglob
          debs=(*.deb)
          [[ ${#debs[@]} -eq 1 && -f ${debs[0]}.sig ]] || { echo "missing the .deb or its updater signature" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          # The notes are this version's CHANGELOG section, as in the release.
          awk -v v="$version" '/^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } } found' \
            ../CHANGELOG.md > ../notes.md
          # The app updates only when installed from this .deb, so it is the only platform entry.
          jq -n --arg version "$version" --rawfile notes ../notes.md --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/${debs[0]}" \
            --rawfile sig "${debs[0]}.sig" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"linux-x86_64-deb": {url: $url, signature: $sig}}}' > latest.json
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      # Signed SLSA provenance for every file in SHA256SUMS, checked with
      # `gh attestation verify <file> --repo 0xV1p3r/0xSk1ll`. GitHub only
      # offers attestations to private repositories on Enterprise Cloud.
      - uses: actions/attest@v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ needs.verify.outputs.stable }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The changelog section for this version, without its heading.
          awk -v v="$version" '/^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } } found' \
            CHANGELOG.md > notes.md
          prerelease=()
          [[ "$STABLE" == true ]] || prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag "${prerelease[@]}" \
            --title "0xSk1ll $version" --notes-file notes.md
