# docker compose -f deploy/docker-compose.hub.yml up -d
# Set SK1LL_HUB_ADMIN_TOKEN (e.g. in deploy/.env) to bootstrap the first join code:
#   curl -X POST -H "Authorization: Bearer $SK1LL_HUB_ADMIN_TOKEN" http://hub:7878/api/join-codes
services:
  hub:
    build:
      context: ..
      dockerfile: Dockerfile.hub
    image: sk1ll-hub
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      SK1LL_HUB_ADMIN_TOKEN: ${SK1LL_HUB_ADMIN_TOKEN:?set SK1LL_HUB_ADMIN_TOKEN}
      SK1LL_HUB_OFFLINE_AFTER: 2m
      SK1LL_HUB_IMPORT_POLL: 1h
      RUST_LOG: info
    volumes:
      - hub-data:/data

volumes:
  hub-data:
