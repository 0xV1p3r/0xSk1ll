# docker compose -f deploy/docker-compose.server.yml up -d
# Set SK1LL_SERVER_ADMIN_TOKEN (e.g. in deploy/.env) to bootstrap the first join code:
#   curl -X POST -H "Authorization: Bearer $SK1LL_SERVER_ADMIN_TOKEN" http://server:7878/api/join-codes
services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile.server
    image: sk1ll-server
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      SK1LL_SERVER_ADMIN_TOKEN: ${SK1LL_SERVER_ADMIN_TOKEN:?set SK1LL_SERVER_ADMIN_TOKEN}
      SK1LL_SERVER_OFFLINE_AFTER: 2m
      SK1LL_SERVER_IMPORT_POLL: 1h
      RUST_LOG: info
    volumes:
      - server-data:/data

volumes:
  server-data:
