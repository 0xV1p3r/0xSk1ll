# docker compose -f deploy/docker-compose.server.yml up -d
# Pulls the release image (the package is private: `docker login ghcr.io` first).
# SK1LL_SERVER_VERSION picks the release (default: the one this file shipped with);
# `docker compose -f deploy/docker-compose.server.yml up -d --build` builds from source instead.
# Set SK1LL_SERVER_ADMIN_TOKEN (e.g. in deploy/.env) to bootstrap the first join code:
#   curl -X POST -H "Authorization: Bearer $SK1LL_SERVER_ADMIN_TOKEN" http://server:7878/api/join-codes
services:
  server:
    image: ghcr.io/0xv1p3r/sk1ll-server:${SK1LL_SERVER_VERSION:-0.1.0}
    build:
      context: ..
      dockerfile: Dockerfile.server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sk1ll-server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "7878:7878"
    environment:
      SK1LL_SERVER_ADMIN_TOKEN: ${SK1LL_SERVER_ADMIN_TOKEN:?set SK1LL_SERVER_ADMIN_TOKEN}
      SK1LL_SERVER_OFFLINE_AFTER: 2m
      SK1LL_SERVER_IMPORT_POLL: 1h
      # Only contact these hosts when checking imports for updates (default: any).
      # SK1LL_SERVER_IMPORT_HOSTS: github.com,gitlab.com
      # Turn server-side import checks off.
      # SK1LL_SERVER_IMPORT_CHECKS: "off"
      RUST_LOG: info
    volumes:
      - server-data:/data

volumes:
  server-data:
