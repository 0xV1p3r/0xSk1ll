[package]
name = "sk1ll-server"
description = "Self-hosted server for a 0xSk1ll fleet: git remote, assignment, status"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sk1ll-server"
path = "src/main.rs"

[dependencies]
sk1ll-core.workspace = true
sk1ll-proto = { path = "../sk1ll-proto" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
getrandom = "0.3"
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
