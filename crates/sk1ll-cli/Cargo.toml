[package]
name = "sk1ll-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sk1ll"
path = "src/main.rs"

[dependencies]
sk1ll-core.workspace = true
anyhow.workspace = true
clap.workspace = true

# The daemon, the hub client and fleet commands are Unix-only; direct mode
# builds everywhere.
[target.'cfg(unix)'.dependencies]
sk1ll-daemon = { path = "../sk1ll-daemon" }
sk1ll-proto = { path = "../sk1ll-proto" }
dirs.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }
