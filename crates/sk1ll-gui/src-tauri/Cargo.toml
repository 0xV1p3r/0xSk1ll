[package]
name = "sk1ll-gui"
description = "0xSk1ll desktop Fleet client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "sk1ll_gui"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
sk1ll-core.workspace = true
sk1ll-daemon = { path = "../../sk1ll-daemon" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.14"
tokio = { version = "1", features = ["time", "macros", "sync"] }

[dev-dependencies]
sk1ll-testkit.workspace = true
axum = "0.8"
tempfile.workspace = true
tokio = { version = "1", features = ["test-util", "net", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[target.'cfg(unix)'.dev-dependencies]
sk1ll-proto = { path = "../../sk1ll-proto" }
tauri = { version = "2", features = ["test"] }
